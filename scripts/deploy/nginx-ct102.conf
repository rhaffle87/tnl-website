map $uri $tnl_edge_api_cache_control {
    default "";
    ~^/api/ "no-store";
}

map $http_x_forwarded_proto $tnl_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_upgrade $tnl_connection_upgrade {
    default upgrade;
    "" "";
}

limit_req_zone $binary_remote_addr zone=tnl_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=tnl_web_limit:10m rate=40r/s;

upstream tnl_api {
    server 100.65.129.8:8001;
    keepalive 32;
}

upstream tnl_frontend {
    server 100.65.129.8:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name labtnl.site www.labtnl.site 100.102.105.77 _;

    client_max_body_size 50M;
    limit_req_status 429;

    # Cloudflare Real-IP Restoration
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://labtnl.site https://accounts.google.com https://cloudflareinsights.com https://challenges.cloudflare.com; frame-src 'self' https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
    add_header Cache-Control $tnl_edge_api_cache_control always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Direct SEO routes to FastAPI SEO router
    location = /robots.txt {
        limit_req zone=tnl_web_limit burst=80 nodelay;
        proxy_pass http://tnl_api/api/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $tnl_forwarded_proto;
    }

    location = /sitemap.xml {
        limit_req zone=tnl_web_limit burst=80 nodelay;
        proxy_pass http://tnl_api/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $tnl_forwarded_proto;
    }

    # Backend API Proxy
    location /api/ {
        limit_req zone=tnl_api_limit burst=40 nodelay;
        proxy_pass http://tnl_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $tnl_forwarded_proto;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Frontend SPA Proxy
    location / {
        limit_req zone=tnl_web_limit burst=80 nodelay;
        proxy_pass http://tnl_frontend;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tnl_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $tnl_forwarded_proto;
        proxy_read_timeout 90s;
    }
}

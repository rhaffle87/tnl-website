# Cache headers share server scope with security headers to preserve inheritance.
map $uri $tnl_seo_cache_control {
    default "no-cache, no-store, must-revalidate";
    ~^/api/ "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~*\.(?:ico|png|svg|webmanifest|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ "public, max-age=604800";
}

server {
    listen 3000;
    server_name _;
    root /opt/tnl/frontend/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://labtnl.site https://accounts.google.com https://cloudflareinsights.com https://challenges.cloudflare.com; frame-src 'self' https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
    add_header Cache-Control $tnl_seo_cache_control always;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    # Immutable cache for hashed production assets
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Brand and static assets
    location ~* \.(?:ico|png|svg|webmanifest|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
    }

    # Admin dashboard uses direct static index.html
    location ^~ /admin {
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic SEO & Open Graph shell for homepage
    location = / {
        proxy_pass http://127.0.0.1:8001/api/seo/render?path=/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic SEO & Open Graph shell for public client routes
    location / {
        try_files $uri @seo_shell;
    }

    location @seo_shell {
        proxy_pass http://127.0.0.1:8001/api/seo/render?path=$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

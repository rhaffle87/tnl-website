# Prometheus configuration for TNL Studio Proxmox LXC infrastructure
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    cluster: 'node2-proxmox'

rule_files:
  - '/etc/prometheus/alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['100.102.105.77:9100']
        labels:
          instance: 'labtnl-web'
          role: 'reverse-proxy'
          ct_id: '102'
      - targets: ['100.65.129.8:9100']
        labels:
          instance: 'labtnl-app'
          role: 'application-backend-frontend'
          ct_id: '103'
      - targets: ['100.111.32.102:9100']
        labels:
          instance: 'labtnl-db'
          role: 'database-mongodb'
          ct_id: '116'
      - targets: ['100.114.215.48:9100']
        labels:
          instance: 'labtnl-monitor'
          role: 'monitoring-prometheus-grafana'
          ct_id: '117'

  - job_name: 'nginx'
    scrape_interval: 10s
    static_configs:
      - targets: ['100.102.105.77:9113']
        labels:
          instance: 'labtnl-web'
          role: 'reverse-proxy'
          ct_id: '102'

  - job_name: 'alertmanager'
    scrape_interval: 15s
    static_configs:
      - targets: ['127.0.0.1:9093']
        labels:
          instance: 'labtnl-monitor'
          role: 'monitoring-alertmanager'
          ct_id: '117'

  - job_name: 'blackbox_exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['127.0.0.1:9115']
        labels:
          instance: 'labtnl-monitor'
          role: 'monitoring-blackbox'
          ct_id: '117'

  - job_name: 'backend_health'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://100.65.129.8:8001/api/health']
        labels:
          instance: 'labtnl-app'
          role: 'application-backend'
          ct_id: '103'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance_url
      - target_label: __address__
        replacement: '127.0.0.1:9115'

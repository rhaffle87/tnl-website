groups:
  - name: tnl_cluster_alerts
    rules:
      - alert: NodeDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} (CT {{ $labels.ct_id }}) is down"
          description: "Target {{ $labels.instance }} has been unreachable for more than 2 minutes."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100) < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low root disk space on {{ $labels.instance }} (CT {{ $labels.ct_id }})"
          description: "Available disk space is {{ $value | printf \"%.1f\" }}% on root mountpoint."

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100) < 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL root disk space on {{ $labels.instance }} (CT {{ $labels.ct_id }})"
          description: "Available disk space is less than 10% on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: HighCpuUsage
        expr: (100 - (avg by (instance, ct_id) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage sustained above 85% for 10 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: MongodbBackupStale
        expr: (time() - tnl_backup_last_timestamp_seconds{type="mongodb"}) > 100800
        labels:
          severity: critical
        annotations:
          summary: "MongoDB daily backup is stale on CT 116"
          description: "Last successful MongoDB backup was more than 28 hours ago."

      - alert: MongodbBackupMetricMissing
        expr: absent(tnl_backup_last_timestamp_seconds{type="mongodb"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB backup freshness metric is missing"
          description: "Prometheus has no successful backup timestamp metric from CT 116."

      - alert: MediaBackupStale
        expr: (time() - tnl_backup_last_timestamp_seconds{type="media"}) > 100800
        labels:
          severity: warning
        annotations:
          summary: "Media & uploads daily backup is stale on CT 103"
          description: "Last successful Media backup was more than 28 hours ago."

      - alert: MediaBackupMetricMissing
        expr: absent(tnl_backup_last_timestamp_seconds{type="media"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Media backup freshness metric is missing"
          description: "Prometheus has no successful media backup timestamp metric from CT 103."

      - alert: NginxExporterDown
        expr: up{job="nginx"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nginx reverse proxy on CT 102 is failing to report status"
          description: "Nginx exporter cannot scrape stub_status on CT 102."

      - alert: NginxUnavailable
        expr: nginx_up{job="nginx"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nginx on CT 102 is unavailable"
          description: "The Nginx exporter is reachable but cannot scrape its local stub_status endpoint."

      - alert: BackendHealthProbeFailed
        expr: probe_success{job="backend_health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend health probe failed on CT 103"
          description: "The public health endpoint is not returning HTTP 2xx; this also detects a degraded Redis rate limiter."

      - alert: BlackboxExporterDown
        expr: up{job="blackbox_exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox exporter is unavailable on CT 117"
          description: "Backend health probes cannot run until the local exporter is restored."

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is unavailable on CT 117"
          description: "Prometheus can evaluate alerts but cannot deliver them while Alertmanager is unavailable."

      - alert: AlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager notification delivery is failing"
          description: "Alertmanager reported failed notification attempts in the last five minutes."

      - alert: EdgeHealthProbeFailed
        expr: probe_success{job="edge_health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Edge reverse-proxy health probe failed on CT 102"
          description: "CT 102 edge proxy is not returning HTTP 2xx for /api/health."

      - alert: PublicSiteProbeFailed
        expr: probe_success{job="public_site"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Public site https://labtnl.site/ probe failed"
          description: "External access through Cloudflare Tunnel and edge Nginx is returning non-2xx or timing out."

      - alert: RedisDown
        expr: up{job="redis"} == 0 or redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis on CT 103 is down"
          description: "Redis exporter reports Redis unavailable or scrape failed."

      - alert: RedisHighMemory
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) > 0.85 and redis_memory_max_bytes > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high on CT 103"
          description: "Redis memory usage exceeded 85% of configured maxmemory."

      - alert: MongodbDown
        expr: tnl_mongodb_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB on CT 116 is down"
          description: "CT 116 MongoDB metrics collector reported MongoDB unavailable."

      - alert: MongodbMetricsMissing
        expr: absent(tnl_mongodb_up)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MongoDB health metric is missing on CT 116"
          description: "Prometheus has no recent tnl_mongodb_up metric from CT 116."

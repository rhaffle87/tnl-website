# Isolated local preview. Does not load backend/.env or publish MongoDB.
services:
  mongodb:
    image: mongo:7
    volumes:
      - local-mongo:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: tnl_local_preview
      MEDIA_DIR: /data/media
      PUBLIC_SITE_URL: http://localhost:3100
      APP_URL: http://localhost:3100
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
      SEED_ADMIN_EMAIL: admin@localhost.test
      SEED_ADMIN_NAME: Local Preview Admin
      SMTP_HOST: ""
    # Hide any repository .env copied by the backend image.
    volumes:
      - local-media:/data/media
      - ./docker/local.empty.env:/app/.env:ro
    ports:
      - "127.0.0.1:8001:8001"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3100:3000"
volumes:
  local-mongo:
  local-media:

# Clean-clone bring-up:  docker compose up --build
# Then seed:             docker compose exec backend python seed.py --reset
# Admin sign-in:         http://localhost:3000/admin/login  (see README)
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    # backend/.env is the single source of truth (see README). Only container-specific
    # values are pinned here; do NOT re-declare ${VAR:-default} entries, because variables
    # already present in the environment win over load_dotenv() and would silently shadow
    # backend/.env (e.g. COOKIE_SECURE, SEED_ADMIN_PASSWORD).
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://mongodb:27017
      MEDIA_DIR: /data/media
    volumes:
      - ./backend:/app
      - media-data:/data/media
    ports:
      - "127.0.0.1:8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo-data:
  media-data:

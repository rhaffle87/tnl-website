  </g>
  <!-- Wordmark -->
  <text x="68" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#004B93" letter-spacing="1">ITS</text>
  <text x="69" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#5A6B7C" letter-spacing="0.5">Institut Teknologi Sepuluh Nopember</text>
</svg>

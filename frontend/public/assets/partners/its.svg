<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none" role="img" aria-label="Institut Teknologi Sepuluh Nopember Logo">
  <!-- ITS Emblem -->
  <g transform="translate(10, 6)">
    <!-- Outer Gear / Chakra -->
    <circle cx="24" cy="24" r="22" stroke="#004B93" stroke-width="4" fill="#004B93" fill-opacity="0.1"/>
    <!-- Gear teeth -->
    <path d="M24 0 L24 6 M24 42 L24 48 M0 24 L6 24 M42 24 L48 24 M7 7 L11 11 M37 37 L41 41 M7 41 L11 37 M37 11 L41 7" stroke="#004B93" stroke-width="4" stroke-linecap="round"/>
    <!-- Golden Core / Flame / Leaves -->
    <circle cx="24" cy="24" r="14" fill="#004B93"/>
    <path d="M24 13 C21 18 20 22 24 29 C28 22 27 18 24 13 Z" fill="#FFC82C"/>
    <path d="M19 19 C18 23 20 26 24 28 C22 24 20 21 19 19 Z" fill="#FFC82C"/>
    <path d="M29 19 C30 23 28 26 24 28 C26 24 28 21 29 19 Z" fill="#FFC82C"/>

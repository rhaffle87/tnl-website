<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link id="tnl-favicon-svg" rel="icon" type="image/svg+xml" href="/favicon-dark.svg?v=5" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-white.svg?v=5" media="(prefers-color-scheme: dark)" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5" />
    <link rel="shortcut icon" href="/favicon.ico?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <meta name="theme-color" content="#111613" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          // --- Auto-Adaptive Favicon synced strictly with browser/OS prefers-color-scheme ---
          var darkMql = window.matchMedia("(prefers-color-scheme: dark)");
          function syncAdaptiveFavicon(isDark) {
            var targetHref = isDark ? "/favicon-white.svg?v=5" : "/favicon-dark.svg?v=5";
            var dynamicFavicon = document.querySelector('link[data-dynamic-favicon="true"]');
            if (!dynamicFavicon) {
              // Deactivate static conflicting svg links in DOM so dynamicFavicon is authoritative
              var staticSvgLinks = document.querySelectorAll('link[rel="icon"][type="image/svg+xml"]:not([data-dynamic-favicon="true"])');
              for (var i = 0; i < staticSvgLinks.length; i++) {
                staticSvgLinks[i].setAttribute("data-inactive-favicon", "true");
                staticSvgLinks[i].removeAttribute("rel");
              }

              dynamicFavicon = document.createElement("link");
              dynamicFavicon.setAttribute("rel", "icon");
              dynamicFavicon.setAttribute("type", "image/svg+xml");
              dynamicFavicon.setAttribute("data-dynamic-favicon", "true");
              document.head.appendChild(dynamicFavicon);
            }
            if (dynamicFavicon.getAttribute("href") !== targetHref) {
              dynamicFavicon.setAttribute("href", targetHref);
            }
          }

          syncAdaptiveFavicon(darkMql.matches);

          if (darkMql.addEventListener) {
            darkMql.addEventListener("change", function(e) {
              syncAdaptiveFavicon(e.matches);
            });
          } else if (darkMql.addListener) {
            darkMql.addListener(function(e) {
              syncAdaptiveFavicon(e.matches);
            });
          }

          // --- In-Page Theme & GSM Tokens initialization ---
          var stored = localStorage.getItem("tnl-theme");
          var isDark = stored === "dark" || (!stored && darkMql.matches);

          if (isDark) {
            document.documentElement.classList.add("dark");
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.content = "dark";
          } else if (stored === "light") {
            document.documentElement.classList.remove("dark");
            var metaLight = document.querySelector('meta[name="color-scheme"]');
            if (metaLight) metaLight.content = "light";
          }

          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(e) {
            if (!localStorage.getItem("tnl-theme")) {
              document.documentElement.classList.toggle("dark", e.matches);
              var m = document.querySelector('meta[name="color-scheme"]');
              if (m) m.content = e.matches ? "dark" : "light";
            }
          });

          var tokensStr = localStorage.getItem("tnl-theme-tokens");
          if (tokensStr) {
            var t = JSON.parse(tokensStr);
            var root = document.documentElement;
            if (t.primary_color) root.style.setProperty("--gsm-primary", t.primary_color);
            if (t.emerald_color) root.style.setProperty("--gsm-emerald", t.emerald_color);
            if (t.obsidian_color) root.style.setProperty("--gsm-obsidian", t.obsidian_color);
            if (t.accent_color) root.style.setProperty("--gsm-accent", t.accent_color);
            if (t.accent_hover_color) root.style.setProperty("--gsm-accent-hover", t.accent_hover_color);
          }
        } catch (e) {}
      })();
    </script>
    <title>Telecommunication Network Laboratory — ITS Surabaya</title>
    <meta
      name="description"
      content="Telecommunication Network Laboratory (TNL), Department of Electrical Engineering, Institut Teknologi Sepuluh Nopember — Room B-301, Surabaya. Research, practicum, training and assistant activities."
    />
    <meta property="og:title" content="Telecommunication Network Laboratory — ITS Surabaya" />
    <meta
      property="og:description"
      content="Research, practicum, training and assistant activities at the Telecommunication Network Laboratory, Department of Electrical Engineering, ITS Surabaya."
    />
    <meta property="og:image" content="https://labtnl.site/assets/brand/tnl-logo-badge.png" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

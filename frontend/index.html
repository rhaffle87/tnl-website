<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#111613" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const stored = localStorage.getItem("tnl-theme");
        if (stored === "dark" || (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = "dark";
        } else if (stored === "light") {
          document.documentElement.classList.remove("dark");
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = "light";
        }

        const tokensStr = localStorage.getItem("tnl-theme-tokens");
        if (tokensStr) {
          const t = JSON.parse(tokensStr);
          const root = document.documentElement;
          if (t.primary_color) root.style.setProperty("--gsm-primary", t.primary_color);
          if (t.emerald_color) root.style.setProperty("--gsm-emerald", t.emerald_color);
          if (t.obsidian_color) root.style.setProperty("--gsm-obsidian", t.obsidian_color);
          if (t.accent_color) root.style.setProperty("--gsm-accent", t.accent_color);
          if (t.accent_hover_color) root.style.setProperty("--gsm-accent-hover", t.accent_hover_color);
        }
      } catch (e) {}
    </script>
    <title>Telecommunication Network Laboratory — ITS Surabaya</title>
    <meta
      name="description"
      content="Telecommunication Network Laboratory (TNL), Department of Electrical Engineering, Institut Teknologi Sepuluh Nopember — Room B-301, Surabaya. Research, practicum, training and assistant activities."
    />
    <meta property="og:title" content="Telecommunication Network Laboratory — ITS Surabaya" />
    <meta
      property="og:description"
      content="Research, practicum, training and assistant activities at the Telecommunication Network Laboratory, Department of Electrical Engineering, ITS Surabaya."
    />
    <meta property="og:image" content="https://labtnl.site/assets/brand/tnl-logo-badge.png" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

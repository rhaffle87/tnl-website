name: Scheduled Live Smoke

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Daily at 01:00 UTC (08:00 WIB)
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  smoke-test:
    name: Live Read-Only Smoke & Visual Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-dev-py312.lock

      - name: Install Playwright & Dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev-py312.lock
          python -m playwright install --with-deps chromium

      - name: Execute Live Smoke Test against labtnl.site
        run: |
          python -u scripts/test/run_e2e_smoke.py

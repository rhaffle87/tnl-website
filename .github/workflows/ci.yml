name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Backend Unit & Integration Tests
        env:
          TESTING: "1"
          MONGO_URL: "mongodb://127.0.0.1:27017"
          MONGO_DB: "tnl_ci_isolated"
          JWT_SECRET: "test-ci-secret-key-for-tnl-mock-testing-only-1234567890"
          SEED_ADMIN_PASSWORD: "ChangeMe2026!"
        run: |
          python -m pytest backend/tests -v --cov=backend --cov-report=term-missing

  frontend-checks:
    name: Frontend Typecheck, Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: TypeScript Typecheck
        run: |
          npm --prefix frontend run typecheck

      - name: Run Vitest Suite
        run: |
          npm --prefix frontend run test

      - name: Build Frontend Production Bundle
        run: |
          npm --prefix frontend run build

  web-standards-guard:
    name: Web Standards & Security Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify No Secrets or .env Tracked in Git
        run: |
          echo "Checking tracked files for sensitive env or secret patterns..."
          SUSPECT=$(git ls-files | grep -E '(\.env$|\.env\.local$|\.env\.production$|token\.json|credentials\.json)' || true)
          if [ -n "$SUSPECT" ]; then
            echo "::error::Found sensitive files committed to Git:"
            echo "$SUSPECT"
            exit 1
          fi
          echo "No sensitive secret files found in Git index."

      - name: Verify Repository Cleanliness
        run: |
          echo "Ensuring no stray backups or archives in working tree..."
          ARCHIVES=$(git ls-files | grep -E '(\.tar\.gz$|\.archive\.gz$|\.archive$)' || true)
          if [ -n "$ARCHIVES" ]; then
            echo "::error::Found archive files committed to Git:"
            echo "$ARCHIVES"
            exit 1
          fi
          echo "Repository working tree is clean."

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Backend Unit & Integration Tests
        env:
          TESTING: "1"
          MONGO_URL: "mongodb://127.0.0.1:27017"
          DB_NAME: "tnl_ci_isolated"
          MEDIA_DIR: "/tmp/media"
          JWT_SECRET: "test-ci-secret-key-for-tnl-mock-testing-only-1234567890"
          SEED_ADMIN_PASSWORD: "ChangeMe2026!"
        run: |
          python -m pytest backend/tests -v --cov=backend --cov-report=term-missing

  frontend-checks:
    name: Frontend Typecheck, Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: TypeScript Typecheck
        run: |
          npm --prefix frontend run typecheck

      - name: Run Vitest Suite
        run: |
          npm --prefix frontend run test

      - name: Build Frontend Production Bundle
        run: |
          npm --prefix frontend run build

      - name: Install Playwright Chromium
        run: |
          cd frontend && npx playwright install --with-deps chromium

      - name: Playwright Layout Geometry Gate
        run: |
          npm --prefix frontend run test:geometry

  web-standards-guard:
    name: Repository Hygiene & Security Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify No Secrets or .env Tracked in Git
        run: |
          echo "Checking tracked files for sensitive env or secret patterns..."
          SUSPECT=$(git ls-files | grep -E '(\.env$|\.env\.local$|\.env\.production$|token\.json|credentials\.json)' || true)
          if [ -n "$SUSPECT" ]; then
            echo "::error::Found sensitive files committed to Git:"
            echo "$SUSPECT"
            exit 1
          fi
          echo "No sensitive secret files found in Git index."

      - name: Verify No Tracked Archives and Clean Working Tree
        run: |
          echo "Ensuring no archive files are tracked and the working tree is clean..."
          ARCHIVES=$(git ls-files | grep -E '(\.tar\.gz$|\.archive\.gz$|\.archive$)' || true)
          if [ -n "$ARCHIVES" ]; then
            echo "::error::Found archive files committed to Git:"
            echo "$ARCHIVES"
            exit 1
          fi
          DIRTY=$(git status --porcelain --untracked-files=normal)
          if [ -n "$DIRTY" ]; then
            echo "::error::Working tree contains uncommitted or untracked files:"
            echo "$DIRTY"
            exit 1
          fi
          echo "Repository working tree is clean."

      - name: Scan Tracked Sources for Hardcoded Credential Assignments
        run: |
          echo "Scanning tracked source files for obvious credential assignments..."
          # Nilai literal 16+ karakter saja; kata "secret" di docs, contoh .env,
          # fixture test, dan workflow CI tidak ikut dipindai.
          PATTERN="(SECRET|TOKEN|PASSWORD|PASSWD|API_KEY|APIKEY|PRIVATE_KEY|ACCESS_KEY|CREDENTIAL)[A-Z0-9_]*[[:space:]]*[:=][[:space:]]*[\"']?[A-Za-z0-9+/=_-]{16,}[\"']?([[:space:]]|;|$)"
          CREDENTIALS=$(git grep -n -I -E -i -e "$PATTERN" -- . \
            ':(exclude)*.example' ':(exclude)*.example.*' ':(exclude)*.md' \
            ':(exclude)backend/tests/**' ':(exclude)**/*test*' ':(exclude)**/__tests__/**' \
            ':(exclude)frontend/e2e/**' ':(exclude).github/workflows/**' \
            ':(exclude)*.lock' ':(exclude)package-lock.json' || true)
          CREDENTIALS=$(echo "$CREDENTIALS" | grep -v -E -i '(process\.env|os\.environ|getenv|settings\.|config\.|\$\{|placeholder|example|dummy|changeme|test-ci|redacted|<[A-Za-z])' || true)
          if [ -n "$CREDENTIALS" ]; then
            echo "::error::Possible hardcoded credentials in tracked source:"
            echo "$CREDENTIALS"
            exit 1
          fi
          echo "No hardcoded credential assignments found in tracked source."
